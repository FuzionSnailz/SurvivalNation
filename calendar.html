<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SurvivalNation</title>
    <style>
        body {
            background-image: url("bkg.jpg");
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: fixed;
        }
    </style>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="calendar.css">

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1156327740660525"
     crossorigin="anonymous"></script>
</head>
<body>
    <div class="header-container">
        <h1>SurvivalNation</h1>
        <nav>
            <ul>
                <li><a href="surivalnation.html">Home</a></li>
                <li><a href="games.html">Games</a></li>
                <li><a href="music.html">Music</a></li>
                <li><a href="merch.html">Merch</a></li>
                <li><a href="collab.html">Collaborations</a></li>
                <li><a href="calendar.html">Calendar</a></li>
            </ul>
        </nav>
    </div>
    <div class="subpage-header">
        <img src="header.png" alt="QDEX Header Image" class="header-image">
    </div>

    <main class="calendar-wrapper">
        <div class="calendar-header">
            <button id="prevMonth">&lt;</button>
            <h2 id="monthYear">Month Year Event Calendar</h2>
            <button id="nextMonth">&gt;</button>
        </div>

        <div class="calendar-container">
            <div id="calendar" class="calendar-grid"></div>
            <div id="eventDetails" class="event-details">
                <h3 id="eventTitle">Select a date with events</h3>
                <p id="eventDate"></p>
                <p id="eventTime"></p>
                <p id="eventLocation"></p>
                <p id="eventArtist"></p>
                <p id="eventDescription"></p>
                <div id="eventMedia"></div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 SurvivalNation. All rights reserved.</p>
    </footer>

    <script src="calendar.js"></script>
</body>
