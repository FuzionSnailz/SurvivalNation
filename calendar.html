<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="SNAKEZ.png">
    <title>SurvivalNation</title>
    <style>
        body {
            background-image: url("bkg.jpg");
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: fixed;
        }
    </style>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="calendar.css">

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1156327740660525"
     crossorigin="anonymous"></script>
</head>
<body>
    <div class="header-container">
        <h1>SurvivalNation</h1>
        <nav>
            <ul>
                <li><a href="survivalnation.html">Home</a></li>
                <li><a href="games.html">Games</a></li>
                <li><a href="music.html">Music</a></li>
                <li><a href="merch.html">Merch</a></li>
                <li><a href="collab.html">Collaborations</a></li>
                <li><a href="calendar.html">Calendar</a></li>
            </ul>
        </nav>
    </div>
    <div class="subpage-header">
        <img src="header.png" alt="QDEX Header Image" class="header-image">
    </div>

    <main class="calendar-wrapper">
        <div class="month-header">
            <div id="prevMonth" class="nav-button">Previous</div>
            <h2 id="monthYear">November 2025 Event Calendar</h2>
            <div id="nextMonth" class="nav-button">Next</div>
        </div>

        <div class="calendar-container">
            <div class="calendar-grid-wrapper">
                <div class="calendar-weekdays">
                    <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div>
                    <div>Thu</div><div>Fri</div><div>Sat</div>
                </div>
                <div id="calendar" class="calendar-grid"></div>
            </div>

            <div class="event-panel">
                <div class="event-details" id="eventDetails">
                    <h3 id="eventTitle">Click a date for event details</h3>
                    <p id="eventDate"></p>
                    <p id="eventTime"></p>
                    <p id="eventLocation"></p>
                    <p id="eventArtist"></p>
                    <p id="eventDescription"></p>
                    <div id="eventMedia"></div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 SurvivalNation. All rights reserved. Contact Us: <a href="mailto:survivalnationsnz@gmail.com">survivalnationsnz@gmail.com</a></p>
    </footer>

    <script src="calendar.js"></script>
</body>
</html>
